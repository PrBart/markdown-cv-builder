name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated JSON schema is up to date
        run: npm run schema:check

      - name: Check, test, and build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build
